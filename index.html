<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>사출생산팀 설비 분석 대시보드</title>
    <!-- stlite 최신 버전(latest)으로 업그레이드 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@latest/build/stlite.css" />
  </head>
  <body>
    <div id="root"></div>
    <!-- stlite 최신 버전(latest) 엔진 로드 -->
    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@latest/build/stlite.js"></script>
    <script>
      stlite.mount({
        requirements: ["pandas", "plotly", "openpyxl"],
        entrypoint: "app_v2.py",
        files: {
          "app_v2.py": {
            url: "./app_v2.py"
          }
        }
      }, document.getElementById("root"));
    </script>
  </body>
</html>
