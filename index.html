<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>사출생산팀 설비 분석 대시보드</title>
    <!-- stlite 스타일시트 로드 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.58.0/build/stlite.css" />
  </head>
  <body>
    <div id="root"></div>
    <!-- stlite 브라우저 실행 엔진 로드 -->
    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.58.0/build/stlite.js"></script>
    <script>
      stlite.mount({
        // 대시보드 실행에 필요한 파이썬 라이브러리 지정
        requirements: ["pandas", "plotly", "openpyxl"],
        // 실행할 메인 파일 지정
        entrypoint: "app_v2.py",
        files: {
          "app_v2.py": {
            url: "./app_v2.py"
          }
        }
      }, document.getElementById("root"));
    </script>
  </body>
</html>
